apiVersion: apps/v1

kind: Deployment

metadata:
  name: backend

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

          volumeMounts:
            - name: cache
              mountPath: /cache

          startupProbe:
            httpGet:
              path: /health/startup
              port: 8080
            periodSeconds: 5
            failureThreshold: 20

          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            initialDelaySeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 10
            initialDelaySeconds: 20
            failureThreshold: 3
            timeoutSeconds: 2

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
      volumes:
        - name: cache
          emptyDir: {}
